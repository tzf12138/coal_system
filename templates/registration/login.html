{% extends "base.html" %}
{% block title %}登录{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-4">
        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-body p-4">
                <h3 class="mb-3">平台登录</h3>
                <p class="text-muted">演示账号：admin / admin123456</p>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button class="btn btn-dark w-100">登录</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
